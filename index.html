<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Page Narrative Portfolio</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        :root { --bg: #000; --text: #fff; --accent: #ff3e00; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Helvetica', sans-serif; }

        /* Smooth Snap Container */
        .main-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        section {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 5vw;
            box-sizing: border-box;
        }

        /* Side Navigation Dots */
        .nav-dots {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 50%; transition: 0.3s; }
        .dot.active { background: var(--accent); transform: scale(1.5); }

        /* Typography & Layouts */
        h2 { font-size: 10vw; text-transform: uppercase; line-height: 0.8; margin: 0; z-index: 2; }
        .reveal { opacity: 0; transform: translateY(50px); }
        
        .img-box {
            position: absolute;
            width: 30vw;
            height: 40vh;
            background: #111;
            overflow: hidden;
            z-index: 1;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }

        /* Specific positions for visual variety */
        .pos-right { right: 10%; top: 20%; }
        .pos-left { left: 10%; bottom: 20%; }
        .pos-center { left: 50%; top: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <div class="nav-dots" id="dot-container"></div>

    <div class="main-container" id="scroller">
        <section id="s1"><h2>Anton<br>& Irene</h2></section>
        
        <section id="s2">
            <div class="img-box pos-right"><img src="https://picsum.photos/800/1000?v=2"></div>
            <h2 class="reveal">Work<br>Ethic</h2>
        </section>

        <section id="s3">
            <div class="img-box pos-left"><img src="https://picsum.photos/800/1000?v=3"></div>
            <h2 class="reveal" style="text-align: right;">Digital<br>Soul</h2>
        </section>

        <section id="s4">
            <h2 class="reveal">Project<br>Alpha</h2>
            <div class="img-box pos-center" style="width: 80vw; height: 30vh; z-index: 0; opacity: 0.3;">
                <img src="https://picsum.photos/1200/600?v=4">
            </div>
        </section>

        <section id="s5">
            <h2 class="reveal" style="color: var(--accent);">Strategy</h2>
        </section>

        <section id="s6">
            <div class="img-box pos-right" style="width: 50vw;"><img src="https://picsum.photos/1000/1000?v=6"></div>
            <h2 class="reveal">Identity</h2>
        </section>

        <section id="s7">
            <h2 class="reveal">System<br>Design</h2>
        </section>

        <section id="s8">
            <div class="img-box pos-left"><img src="https://picsum.photos/800/1000?v=8"></div>
            <h2 class="reveal">Motion</h2>
        </section>

        <section id="s9">
            <h2 class="reveal">Future<br>Tools</h2>
        </section>

        <section id="s10">
            <h2 class="reveal">Contact<br>Us</h2>
            <p style="position: absolute; bottom: 10%; font-family: monospace;">info@example.com</p>
        </section>
    </div>

    <script>
        window.addEventListener('load', function() {
            gsap.registerPlugin(ScrollTrigger);
            const sections = gsap.utils.toArray("section");
            const dots = [];

            // Generate Nav Dots
            const dotContainer = document.getElementById('dot-container');
            sections.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dotContainer.appendChild(dot);
                dots.push(dot);
            });

            // Core Animation Loop
            sections.forEach((section, i) => {
                
                // Animation for text reveal
                const title = section.querySelector('h2');
                gsap.to(title, {
                    scrollTrigger: {
                        trigger: section,
                        scroller: "#scroller",
                        start: "top center",
                        toggleActions: "play none none reverse"
                    },
                    opacity: 1,
                    y: 0,
                    duration: 1.2,
                    ease: "power4.out"
                });

                // Animation for image parallax
                const img = section.querySelector('.img-box');
                if(img) {
                    gsap.from(img, {
                        scrollTrigger: {
                            trigger: section,
                            scroller: "#scroller",
                            start: "top bottom",
                            end: "bottom top",
                            scrub: 1
                        },
                        y: 100,
                        rotate: 5
                    });
                }

                // Update Active Dot
                ScrollTrigger.create({
                    trigger: section,
                    scroller: "#scroller",
                    start: "top center",
                    end: "bottom center",
                    onEnter: () => updateDots(i),
                    onEnterBack: () => updateDots(i)
                });
            });

            function updateDots(index) {
                dots.forEach(d => d.classList.remove('active'));
                dots[index].classList.add('active');
            }
        });
    </script>
</body>
</html>
