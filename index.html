<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Delight Portfolio</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        :root {
            --bg: #000;
            --text: #fff;
            --accent: #00ffcc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica;
            line-height: 1.4;
        }

        /* Hero Section */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: 15vw;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
        }

        /* Project Cards */
        .project {
            padding: 40px 20px;
            margin-bottom: 50px;
        }

        .img-container {
            width: 100%;
            aspect-ratio: 3/4;
            background: #111;
            overflow: hidden;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.2); /* For parallax zoom */
        }

        .project-info h2 {
            font-size: 2.5rem;
            margin: 10px 0;
            color: var(--accent);
        }

        .project-info p {
            font-size: 1.1rem;
            opacity: 0.7;
            max-width: 90%;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1 class="reveal">Creative<br>Director</h1>
        <p class="reveal" style="margin-top: 20px;">Based in NYC. Focused on tactile digital experiences.</p>
    </section>

    <section class="project" id
